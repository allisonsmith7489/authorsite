<!-- contact.html (Contact Page) -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Allison Smith</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <nav class="navbar">
        <a href="index.html" class="nav-link">Home</a>
        <a href="about.html" class="nav-link">About</a>
        <a href="contact.html" class="nav-link active">Contact</a>
    </nav>


    <div class="page-cover">
        <div class="cover-overlay"></div>
    </div>

    <main class="content-wrapper">
        <section class="contact-section">
            <h2>Contact Me</h2>
            <p class="email-direct">Email: <a href="mailto:allisonsmith7489@gmail.com">allisonsmith7489@gmail.com</a>
            </p>

            <form action="https://formspree.io/f/xqppgjpy" method="POST">
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" required>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="_replyto" required>
                </div>
                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="5" required></textarea>
                </div>
                <!-- Keeps the user on your site after they click submit 
                <input type="hidden" name="_next" value="https://booksonastring.com/">-->

                <button type="submit" class="cta-btn" style="border:none; cursor:pointer;">Send Message</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; Allison Smith. Design: HTML5</p>
    </footer>
</body>

</html>
