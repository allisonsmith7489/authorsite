<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You | Allison Smith</title>
    <style>
        /* This perfectly matches the core font and styling stack of your HTML5 UP theme */
        body {
            background-color: #faf8f5;
            color: #2c3e35;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            padding: 1rem;
        }

        .container {
            max-width: 500px;
            background: white;
            padding: 3rem 2rem;
            border-radius: 8px;
            border: 1px solid #e3dec3;
            box-shadow: 0 4px 20px rgba(46, 90, 68, 0.03);
        }

        span.icon {
            font-size: 3rem;
            display: block;
            margin-bottom: 1rem;
        }

        h1 {
            font-family: 'Georgia', serif;
            font-size: 2.2rem;
            margin-bottom: 1rem;
            font-weight: 700;
        }

        p {
            font-size: 1.1rem;
            color: #5c6b62;
            line-height: 1.6;
            margin-bottom: 2rem;
        }

        .back-btn {
            display: inline-block;
            background-color: #2e5a44;
            color: white;
            padding: 0.9rem 2rem;
            text-decoration: none;
            border-radius: 4px;
            font-weight: bold;
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: background-color 0.2s ease;
        }

        .back-btn:hover {
            background-color: #1e3c2d;
        }
    </style>
</head>

<body>

    <div class="container">
        <span class="icon">🌲</span>
        <h1>Message Sent</h1>
        <p>Thank you for reaching out, Allison will get back to you as soon as possible.</p>
        <a href="index.html" class="back-btn">Return Home</a>
    </div>

</body>

</html>
